name: Wazy
options:
  bundleIdPrefix: com.starplayrx
  deploymentTarget:
    macOS: "14.0"
packages:
  WazKit:
    url: https://github.com/AgentiLoop/WazKit.git
    from: 1.0.0
targets:
  Wazy:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: WazKit
    scheme:
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Wazy
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "5"
        LSApplicationCategoryType: public.app-category.entertainment
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: Wazy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.starplayrx.wazy
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 469UCUB275
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
