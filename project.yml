name: Wazy
options:
  bundleIdPrefix: com.starplayrx
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  WazKit:
    url: https://github.com/AgentiLoop/WazKit.git
    from: 1.0.0
targets:
  Wazy:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: WazKit
    scheme:
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Wazy
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "6"
        LSApplicationCategoryType: public.app-category.entertainment
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: Wazy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.starplayrx.wazy
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 469UCUB275
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
  WazyiOS:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - iOS
      - Sources/ContentView.swift
      - Sources/Models.swift
      - Sources/DisneyClient.swift
      - Sources/SignIn.swift
    dependencies:
      - package: WazKit
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Wazy
        CFBundleShortVersionString: "1.0.5"
        CFBundleVersion: "6"
        LSApplicationCategoryType: public.app-category.entertainment
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Wazy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.starplayrx.wazy.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 469UCUB275
        GENERATE_INFOPLIST_FILE: NO
