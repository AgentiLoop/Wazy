name: Wazy
options:
  bundleIdPrefix: com.starplayrx
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  WazKit:
    url: https://github.com/AgentiLoop/WazKit.git
    from: 1.0.0
targets:
  Wazy:
    type: application
    # One target, one scheme: pick My Mac or an iPhone in Xcode's destination menu.
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources
        excludes: [Updater.swift, WazyApp.swift, Assets.xcassets, Info.plist]
      - path: Sources/WazyApp.swift
        destinationFilters: [macOS]
      - path: Sources/Updater.swift
        destinationFilters: [macOS]
      - path: Sources/Assets.xcassets
        destinationFilters: [macOS]
      - path: iOS
        excludes: [Info.plist]
        destinationFilters: [iOS]
    dependencies:
      - package: WazKit
    scheme:
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    settings:
      base:
        PRODUCT_NAME: Wazy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.starplayrx.wazy
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=iphoneos*]": com.starplayrx.wazy.ios
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=iphonesimulator*]": com.starplayrx.wazy.ios
        INFOPLIST_FILE: Sources/Info.plist
        "INFOPLIST_FILE[sdk=iphoneos*]": iOS/Info.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": iOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 469UCUB275
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
